name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on the ubuntu-latest runner image, so
      # this doesn't pull in a third-party Action for something this simple.
      - name: ShellCheck
        run: shellcheck update-anything.sh install.sh completions/update-anything.bash
      - name: Bash syntax check
        run: |
          bash -n update-anything.sh
          bash -n install.sh
